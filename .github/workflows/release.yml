name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Enable pnpm for caching
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          test "${GITHUB_REF_NAME}" = \
            "v$(node -p 'require("./package.json").version')"
      - name: Verify source and secret boundaries
        run: pnpm verify
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Scan source dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Prove isolated recovery
        run: bash scripts/run-recovery-e2e.sh
      - name: Build and smoke-test release image
        run: |
          time_source="$(git show -s --format=%ct "${GITHUB_SHA}")"
          docker build \
            --build-arg SOURCE_DATE_EPOCH="${time_source}" \
            --build-arg SOURCE_REVISION="${GITHUB_SHA}" \
            --build-arg TOOL_VERSION="$(node -p 'require("./package.json").version')" \
            --tag langfuse-backup:release .
          bash test/container/smoke.sh langfuse-backup:release
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: langfuse-backup:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify artifact metadata
        run: pnpm verify:artifact
        env:
          ARTIFACT_IMAGE: langfuse-backup:release
          SOURCE_REVISION: ${{ github.sha }}

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable pnpm for caching
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package and SPDX
        run: |
          SOURCE_REVISION="${GITHUB_SHA}" pnpm build
          SOURCE_REVISION="${GITHUB_SHA}" pnpm verify:artifact
          pnpm pack --pack-destination .artifacts
      - name: Publish npm package with provenance
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            name_dist=next
          else
            name_dist=latest
          fi
          pnpm publish \
            --access public \
            --no-git-checks \
            --provenance \
            --tag "${name_dist}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Set image name and version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          echo "TOOL_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct)" >> "${GITHUB_ENV}"
      - name: Build and publish multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ github.sha }}
            TOOL_VERSION=${{ env.TOOL_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TOOL_VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Verify published package and image
        run: |
          path_clean="$(mktemp -d)"
          pnpm --dir "${path_clean}" add \
            "langfuse-backup@${TOOL_VERSION}" \
            --save-exact
          pnpm --dir "${path_clean}" exec langfuse-backup --version
          docker pull "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          bash test/container/smoke.sh \
            "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Create GitHub release with SPDX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arguments_release=(
            "${GITHUB_REF_NAME}"
            .artifacts/*.spdx.json
            .artifacts/*.tgz
            --generate-notes
            --verify-tag
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            arguments_release+=(--prerelease)
          fi
          gh release create "${arguments_release[@]}"
